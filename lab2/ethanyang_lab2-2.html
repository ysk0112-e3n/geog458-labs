<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>World Cities by Population Size</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #title {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #fff;
            padding: 10px;
            border-radius: 3px;
            font-size: 20px;
        }

        #legend {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 230px;
            background: #fff;
            margin-right: 20px;
            margin-bottom: 40px;
            padding: 10px 20px 10px 10px;
            border-radius: 3px;
            text-align: center;
        }

        .break {
            position: relative;
            margin: 0;
            padding: 0;
            text-align: left;
        }

        .dot {
            display: inline-block;
            margin-top: 5px;
            border-radius: 50%;
            opacity: 1;
        }

        .dot-label {
            position: absolute;
            top: 0;
            right: 0;
            font-style: italic;
        }

        #legend a {
            color: black;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="title">World Cities by Population Size</div>
    <div id="legend"></div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoieXNrMDExMi1lM24iLCJhIjoiY211enRjMXYzMDE5eTJ4cHN0dGhqMmEweiJ9.XCKoxGAeP5_U2fnJr7G9bQ';

        // A light basemap
        const mymap = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/light-v11',
            projection: 'globe',
            center: [-96, 37.8],
            zoom: 1
        });

        mymap.on('style.load', () => {
            mymap.setFog({});
        });

        mymap.on('load', () => {
            mymap.addSource('population', {
                type: 'geojson',
                data: 'data/world-cities.geojson'
            });

            mymap.addLayer({
                id: 'population-layer',
                type: 'circle',
                source: 'population',
                paint: {
                    // Tertile breaks give groups of 6440, 6440, and 6441 cities.
                    // Radii show population classes, not proportional areas.
                    'circle-radius': [
                        'step', ['get', 'population'],
                        2,
                        25683, 5,
                        57101, 9
                    ],
                    // Darker blues indicate higher population groups.
                    'circle-color': [
                        'step', ['get', 'population'],
                        '#c6dbef',
                        25683, '#6baed6',
                        57101, '#08519c'
                    ],
                    'circle-stroke-width': 1,
                    'circle-stroke-color': 'white'
                }
            });

            // Click a city to view its name and population.
            mymap.on('click', 'population-layer', (event) => {
                const feature = event.features[0];
                const coordinates = feature.geometry.coordinates.slice(0, 2);

                new mapboxgl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(
                        `<strong>City:</strong> ${feature.properties.accentcity}<br>
                         <strong>Population:</strong> ${feature.properties.population}`
                    )
                    .addTo(mymap);
            });
        });

        // Legend ranges, radii, and colors match the map classes.
        const legend = document.getElementById('legend');
        const grades = ['< 25,683', '25,683–57,100', '≥ 57,101'];
        const radii = [2, 5, 9];
        const colors = ['#c6dbef', '#6baed6', '#08519c'];
        const labels = ['<strong>Population (tertiles)</strong>'];

        for (let i = 0; i < grades.length; i++) {
            const value = grades[i];
            const diameter = 2 * radii[i];

            labels.push(
                '<p class="break"><i class="dot" style="background:' + colors[i] +
                '; width:' + diameter + 'px; height:' + diameter +
                'px;"></i> <span class="dot-label" style="top:' +
                diameter / 2 + 'px;">' + value + '</span></p>'
            );
        }

        const source =
            '<p style="text-align:right; font-size:10pt;">Source: ' +
            '<a href="https://www.naturalearthdata.com/">Natural Earth</a>' +
            ' (course file)</p>';

        legend.innerHTML = labels.join('') + source;
    </script>
</body>

</html>
